[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zebralogic"
version = "0.1.0"
description = "ZebraLogic — a Python project."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ronok Ghosal", email = "ghosalronok@gmail.com" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
zebralogic = "zebralogic.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
